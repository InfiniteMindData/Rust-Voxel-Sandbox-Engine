[package]
name = "voxel-engine"
version = "0.1.0"
edition = "2021"
description = "Blockscape - an original voxel sandbox game and engine written in Rust"
license = "MIT"
publish = false

[dependencies]
glam = "0.33"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
